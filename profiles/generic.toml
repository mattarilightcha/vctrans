# ほかのゲームで使うときの土台。写して名前と中身を変える（ファイル名が id になる）。
# exe と send_key を空にすると、字幕は主モニターに出し、英語の声は押さずにそのまま流す（パーティだけ・オープンマイク向け）。

name = "その他のゲーム"
exe = ""                             # 例 "Game.exe"。字幕をこの画面に合わせ、送るキーはこれが前面のときだけ押す
send_key = ""                        # 例 "v"。近接 VC の「押して話す」キー。空なら押さない
glossary = ""                        # 英日の用語集（このフォルダの中のファイル名。.json か「英語 = 日本語」の .txt）
prompt_ja = "オンラインゲームのボイスチャットでの会話。"
hotwords = ""                        # 相手の英語を文字にするときのヒント（固有名詞をカンマで）

setup = [
  ["ゲームのマイク（入力デバイス）", "CABLE Output (VB-Audio Virtual Cable)"],
  ["ボイスチャットの方式", "オープンマイク（押して話すなら、そのキーを send_key に）"],
  ["画面モード", "ボーダーレスかウィンドウ"],
]
notes = [
  "ツールを閉じている間はゲームにマイクが届かない。使わない日はゲームの入力デバイスをヘッドセットのマイクに戻す。",
]
